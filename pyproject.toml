[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs156-ml"
version = "0.1.0"
description = "CS156 Machine Learning Coursework"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Katia", email = "gwaneza@uni.minerva.edu"}
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "scikit-learn>=1.0",
    "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=0.990",
]

[tool.uv]
python-version = "3.9"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
target-version = "py39"
line-length = 88
